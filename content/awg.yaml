full_instruction: |
  <b>🛡 Инструкция для AmneziaVPN</b>

  1. Скачайте приложение AmneziaVPN для вашего устройства:
  • <a href="https://apps.apple.com/us/app/amneziavpn/id1600529900">iOS / iPadOS</a>
  • <a href="https://play.google.com/store/apps/details?id=org.amnezia.vpn">Android</a>
  • <a href="https://github.com/amnezia-vpn/amnezia-client/releases/latest">Windows, macOS, linux</a>

  ⚠️ Часть серверов работает на новом AmneziaWG 3.1 — для них нужно приложение
  AmneziaVPN версии 5.0.1.5 или новее. Если конфиг не подключается — обновите
  приложение до последней версии.

  2. Перейдите в раздел "Мои подписки" в боте.
  3. Выберите подписку AmneziaWG.
  4.1 Для мобильных устройств нажимайте - 🔗AmneziaWG, бот пришлет вам ссылку, просто нажмите на неё и она скопируется.
  4.2 Для ПК - 📥AmneziaWG, вам пришлется конфигурационный файл.
  5. Откройте приложение AmneziaVPN.
  6. Для мобильных устройств - в поле "Вставьте кллюч" вставьте скопированную ссылку(кнопка вставить), для ПК - выберите "Файл с настрйоками подключения" и выберите скачанный конфигурационный файл.
  7. При желании, вы можете настроить "Раздельное туннелирование" (Split Tunneling) в приложении, чтобы указать, какие приложения должны использовать VPN, а какие - нет.
  8. Нажмите "Подключиться"

  ✅ <b>Готово!</b> VPN подключен.
